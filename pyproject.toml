[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genius-dev"
version = "0.1.0"
description = "Local-first autonomous AI software-engineering CLI/TUI"
requires-python = ">=3.11"
dependencies = ["textual>=1.0", "httpx>=0.27", "typer>=0.12", "keyring>=25"]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2", "ruff>=0.5", "mypy>=1.10"]
a11y = ["axe-playwright-python>=0.1.4"]

[project.scripts]
genius = "genius_dev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genius_dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py311"
extend-exclude = ["src/genius_dev/demo_project", "src/genius_dev/demo_debug", "src/genius_dev/demo_web"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501", "E701", "E702", "E731", "E741", "B008", "B904", "UP007", "UP035", "UP037", "E402", "B905", "B007", "B023", "E401", "UP041", "UP045"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
disable_error_code = ["func-returns-value"]
files = ["src/genius_dev"]
exclude = ["demo_project", "demo_debug", "demo_web"]
